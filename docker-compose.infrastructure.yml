version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trailguide-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trailguide_dev
      POSTGRES_USER: trailguide
      POSTGRES_PASSWORD: secure_dev_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailguide -d trailguide_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trailguide-network

  # Redis Cache (for sessions and caching)
  redis:
    image: redis:7-alpine
    container_name: trailguide-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trailguide-network

  # Development Tools Container
  tools:
    image: node:18-alpine
    container_name: trailguide-tools
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: tail -f /dev/null
    networks:
      - trailguide-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trailguide-network:
    driver: bridge