version: '3.8'

# TrailGuide Production Environment
# Enterprise-grade production deployment with high availability

services:
  # API Backend - Production (Multiple Instances)
  api:
    image: ${DOCKER_REGISTRY}/${API_IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=prod
      - INSTANCE_ID=${HOSTNAME:-api-1}
    volumes:
      - api_prod_uploads:/app/uploads:ro
      - api_prod_logs:/app/logs
      - ../../monitoring:/app/monitoring:ro
    networks:
      - trailguide-prod
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  # Frontend - Production (Multiple Instances)
  frontend:
    image: ${DOCKER_REGISTRY}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=prod
    networks:
      - trailguide-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  # NGINX Load Balancer - Production
  nginx:
    image: nginx:1.25-alpine
    container_name: trailguide-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
      - nginx_prod_logs:/var/log/nginx
      - nginx_prod_cache:/var/cache/nginx
    networks:
      - trailguide-prod
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/api/v1/health", "-k"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: trailguide-prometheus-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ../../monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: trailguide-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=app.trailguide.app
      - GF_SERVER_ROOT_URL=https://app.trailguide.app/grafana/
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${DB_HOST}
      - GF_DATABASE_NAME=grafana_prod
      - GF_DATABASE_USER=${GRAFANA_DB_USER}
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD}
      - GF_DATABASE_SSL_MODE=require
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ../../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: trailguide-alertmanager-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://app.trailguide.app/alertmanager/'
    volumes:
      - ../../monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_prod_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Log Aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: trailguide-loki-prod
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_prod_data:/tmp/loki
      - ../../monitoring/loki-prod.yml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Log Collection - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: trailguide-promtail-prod
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../../monitoring/promtail-prod.yml:/etc/promtail/config.yml:ro
    networks:
      - monitoring
    depends_on:
      - loki

  # Backup Service - Automated Database Backups
  backup:
    image: postgres:15-alpine
    container_name: trailguide-backup-prod
    restart: "no"
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_ENCRYPTION_KEY=${PROD_BACKUP_ENCRYPTION_KEY}
    volumes:
      - ../../scripts/backup-prod.sh:/backup.sh:ro
      - backup_prod_data:/backups
    command: /bin/sh -c "chmod +x /backup.sh && /backup.sh"
    networks:
      - trailguide-prod
    profiles:
      - backup
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Security Scanner - Trivy
  security-scanner:
    image: aquasec/trivy:latest
    container_name: trailguide-security-prod
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - security_scan_data:/tmp/trivy
    command: |
      sh -c "
        trivy image --exit-code 1 --severity HIGH,CRITICAL ${DOCKER_REGISTRY}/${API_IMAGE_NAME}:${IMAGE_TAG:-latest}
        trivy image --exit-code 1 --severity HIGH,CRITICAL ${DOCKER_REGISTRY}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG:-latest}
      "
    networks:
      - trailguide-prod
    profiles:
      - security

  # Health Check Service
  healthcheck:
    image: curlimages/curl:latest
    container_name: trailguide-healthcheck-prod
    restart: unless-stopped
    command: |
      sh -c "
        while true; do
          curl -f https://app.trailguide.app/api/v1/health || echo 'Health check failed'
          sleep 30
        done
      "
    networks:
      - trailguide-prod
    profiles:
      - monitoring

volumes:
  api_prod_uploads:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},rw
      device: ":${NFS_PATH}/uploads"
  api_prod_logs:
    driver: local
  nginx_prod_logs:
    driver: local
  nginx_prod_cache:
    driver: local
  prometheus_prod_data:
    driver: local
  grafana_prod_data:
    driver: local
  alertmanager_prod_data:
    driver: local
  loki_prod_data:
    driver: local
  backup_prod_data:
    driver: local
  security_scan_data:
    driver: local

networks:
  trailguide-prod:
    driver: overlay
    name: trailguide-prod-network
    attachable: true
    driver_opts:
      encrypted: "true"
  monitoring:
    driver: overlay
    name: trailguide-monitoring-network
    attachable: true
    driver_opts:
      encrypted: "true"