version: '3.8'

# TrailGuide Development Environment
# Complete development stack with hot reload and debugging

services:
  # PostgreSQL Database - Development
  postgres:
    image: postgres:15-alpine
    container_name: trailguide-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: trailguide_dev
      POSTGRES_USER: trailguide_dev
      POSTGRES_PASSWORD: secure_dev_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Jerusalem
      PGTZ: Asia/Jerusalem
    command: >
      postgres
      -c timezone=Asia/Jerusalem
      -c log_timezone=Asia/Jerusalem
      -c log_statement=all
      -c log_min_duration_statement=0
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailguide_dev -d trailguide_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trailguide-dev

  # Redis Cache - Development
  redis:
    image: redis:7-alpine
    container_name: trailguide-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password_2024
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trailguide-dev

  # API Backend - Development with Hot Reload
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: trailguide-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
    volumes:
      - ../../api:/app
      - api_dev_node_modules:/app/node_modules
      - ../../uploads:/app/uploads
      - ../../logs:/app/logs
      - ../../../monitoring:/app/monitoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trailguide-dev

  # Frontend - Development with Hot Reload
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: trailguide-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
      - HMR_PORT=24678
    volumes:
      - ../../frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - trailguide-dev

  # NGINX Reverse Proxy - Development
  nginx:
    image: nginx:1.25-alpine
    container_name: trailguide-nginx-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../logs/nginx:/var/log/nginx
    networks:
      - trailguide-dev
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development Tools Container
  tools:
    image: node:18-alpine
    container_name: trailguide-tools-dev
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: tail -f /dev/null
    networks:
      - trailguide-dev
    profiles:
      - tools

  # Database Admin (pgAdmin) - Development Only
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trailguide-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trailguide.dev
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - trailguide-dev
    profiles:
      - admin
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  api_dev_node_modules:
    driver: local
  frontend_dev_node_modules:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  trailguide-dev:
    driver: bridge
    name: trailguide-dev-network