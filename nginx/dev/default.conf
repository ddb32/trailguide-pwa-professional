# Development NGINX Configuration for TrailGuide PWA
# This configuration simulates production routing while maintaining development features

# Upstream definitions for development containers
upstream api_backend {
    server api:3000;
}

upstream frontend_backend {
    server frontend:5173;
}

# Rate limiting for development (very permissive for Vite dev server)
limit_req_zone $binary_remote_addr zone=dev_api:10m rate=1000r/m;
limit_req_zone $binary_remote_addr zone=dev_general:10m rate=3000r/m;

# Main server configuration
server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    # File upload configuration - Allow up to 10MB uploads
    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Basic security headers (development-friendly)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Development-friendly CSP (allows unsafe-eval for hot reload)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* wss://localhost:*; media-src 'self'; object-src 'none'; child-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    
    # Apply general rate limiting (extremely permissive for Vite development)
    limit_req zone=dev_general burst=200 nodelay;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "nginx-dev-healthy\n";
        add_header Content-Type text/plain;
    }
    
    # API proxy with development-friendly rate limiting
    location /api/ {
        # Apply API rate limiting (very permissive for development)
        limit_req zone=dev_api burst=100 nodelay;
        
        # Upload-specific configuration for image endpoints
        client_max_body_size 10M;
        client_body_buffer_size 128k;
        
        # Proxy to API backend
        proxy_pass http://api_backend/api/;
        
        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Development-friendly timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS headers for development
        add_header Access-Control-Allow-Origin "http://localhost" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With" always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # Frontend proxy with Vite dev server support
    location / {
        # Proxy to frontend backend (Vite dev server)
        proxy_pass http://frontend_backend/;
        
        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support for Vite dev server
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Accept-Encoding "";
        
        # Development-friendly timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable caching for development
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Handle Vite WebSocket for Hot Module Replacement
    location /vite-dev-server/ {
        proxy_pass http://frontend_backend/vite-dev-server/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Handle @vite/client WebSocket
    location /@vite/client {
        proxy_pass http://frontend_backend/@vite/client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle Vite WebSocket for Hot Module Replacement (_vite/ws endpoint)
    location /_vite/ws {
        proxy_pass http://frontend_backend/_vite/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 502 "Development server unavailable. Please check if containers are running.\n";
        add_header Content-Type text/plain;
    }
}

# Connection upgrade map for WebSockets (HMR support)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}