# HTTPS Configuration for way2party.co.il
# Production SSL configuration for TrailGuide PWA

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name way2party.co.il www.way2party.co.il;

    # Serve Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://way2party.co.il$request_uri;
    }
}

# HTTPS server for way2party.co.il
server {
    listen 443 ssl http2;
    server_name way2party.co.il www.way2party.co.il;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/way2party.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/way2party.co.il/privkey.pem;

    # SSL Security Settings (Modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/way2party.co.il/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers optimized for way2party.co.il
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy for way2party.co.il
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://way2party.co.il; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://way2party.co.il ws://way2party.co.il; media-src 'self'; object-src 'none'; child-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Rate limiting for production
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit_per_ip 15;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy - way2party.co.il\n";
        add_header Content-Type text/plain;
        add_header X-Service "TrailGuide PWA" always;
    }

    # API proxy with enhanced security
    location /api/ {
        # Apply API rate limiting
        limit_req zone=api burst=15 nodelay;

        # Special rate limiting for auth endpoints
        location ~ ^/api/v1/auth/(login|register|refresh) {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            # Enhanced security for auth endpoints
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host way2party.co.il;

            # Security headers for auth
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # General API proxy
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;

        # Production headers
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host way2party.co.il;
        add_header X-API-Version "1.0" always;
        add_header X-Service "TrailGuide API" always;
    }

    # Frontend application with optimized caching
    location / {
        proxy_pass http://frontend_backend;
        include /etc/nginx/conf.d/proxy_params.conf;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host way2party.co.il;

        # Cache static assets with long expiration
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";

            # Security for static assets
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cross-Origin-Resource-Policy "same-site" always;
        }

        # Service worker with no-cache for PWA functionality
        location = /sw.js {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Service-Worker-Allowed "/" always;
            expires 0;
        }

        # PWA manifest
        location = /manifest.json {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            add_header Content-Type "application/json";
            add_header Cache-Control "public, max-age=86400";
        }

        # Favicon optimization
        location = /favicon.ico {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;

            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Security: Block access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Block access to backup and temporary files
    location ~* \.(bak|backup|old|tmp|temp|~|log)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Block access to common attack vectors
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Logging configuration
    access_log /var/log/nginx/way2party_access.log main;
    error_log /var/log/nginx/way2party_error.log warn;
}