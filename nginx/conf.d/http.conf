# HTTP Configuration for TrailGuide PWA (before SSL setup)
server {
    listen 80;
    server_name localhost yourdomain.com www.yourdomain.com;
    
    # Serve Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $content_security_policy always;
    
    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit_per_ip 10;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # API proxy with rate limiting
    location /api/ {
        # Apply API rate limiting
        limit_req zone=api burst=10 nodelay;
        
        # Apply login rate limiting for auth endpoints
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
        
        # General API proxy
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        # API-specific headers
        proxy_set_header Accept-Encoding "";
        add_header X-API-Version "1.0" always;
    }
    
    # Static assets and frontend
    location / {
        proxy_pass http://frontend_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
        
        # Handle service worker
        location = /sw.js {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
        
        # Handle PWA manifest
        location = /manifest.json {
            proxy_pass http://frontend_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            
            add_header Content-Type "application/json";
            add_header Cache-Control "no-cache";
        }
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to backup and temporary files
    location ~* \.(bak|backup|old|tmp|temp|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}